<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none">
  <!-- Glowing shadow for pointer/hover state -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#d4af37" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Wrench turned slightly on hover to simulate tightening/action -->
  <g filter="url(#glow)" transform="rotate(12 3 3) scale(-1, 1) translate(-24, 0)">
    <!-- Active Gold Filled Core -->
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" 
          fill="#d4af37" 
          stroke="#ffe082" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <path d="M14.7 6.3l1.6 1.6" stroke="#040814" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="2.5" cy="16" r="1" fill="#040814"/>
  </g>

  <!-- Active Reticle Target Indicator at (3, 3) -->
  <circle cx="3" cy="3" r="2.2" fill="#ffe082" stroke="#040814" stroke-width="0.8"/>
  <circle cx="3" cy="3" r="0.75" fill="#040814"/>
</svg>
