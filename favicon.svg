<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f1f4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Metallic Radiant Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="35%" stop-color="#f3cf65"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7415"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Orbital Engineering Ring (Rotated Accent) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.5"/>
  <circle cx="49" cy="18" r="2" fill="#ffe082"/>

  <!-- Monogram OD (Stylized Engineering Interlock) -->
  <g filter="url(#goldGlow)">
    <!-- Letter O -->
    <path d="M 23 18 C 16 18 12 24 12 32 C 12 40 16 46 23 46 C 30 46 34 40 34 32 C 34 24 30 18 23 18 Z M 23 23 C 27 23 29 27 29 32 C 29 37 27 41 23 41 C 19 41 17 37 17 32 C 17 27 19 23 23 23 Z" fill="url(#goldGrad)"/>
    
    <!-- Letter D -->
    <path d="M 33 19 L 41 19 C 47.5 19 52 24 52 32 C 52 40 47.5 45 41 45 L 33 45 L 33 40 L 40.5 40 C 44 40 47 37 47 32 C 47 27 44 24 40.5 24 L 33 24 Z" fill="url(#goldGrad)"/>

    <!-- Precision Crosshair Center Accent -->
    <line x1="23" y1="30" x2="23" y2="34" stroke="#ffe082" stroke-width="1" stroke-linecap="round"/>
    <line x1="21" y1="32" x2="25" y2="32" stroke="#ffe082" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>

